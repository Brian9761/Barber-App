name: Test builds

# Demo builds of both apps, for trying them before the App Store: each app runs on its built-in
# sample data (IZZY_DEMO_MODE=YES; see IzzyClipz/App/DemoMode.swift and
# IzzyClipzBusiness/App/DemoMode.swift), never the shop's server and never real money.
#
# One artifact, izzy-clipz-demo-builds, holds:
#   IzzyClipz-Demo.ipa, IzzyClipzBusiness-Demo.ipa
#       The iPhone apps, unsigned: Sideloadly or AltStore signs them with the tester's Apple ID.
#   IzzyClipz-Demo-Simulator.zip, IzzyClipzBusiness-Demo-Simulator.zip
#       The apps for the iOS Simulator in Xcode on a Mac, for Apple silicon and Intel Macs.
#   SHA256SUMS.txt
# Screenshots of each Simulator build just after it launched are in demo-screenshots.
#
# The five files from each build of a push to test-builds are also published as a public
# prerelease that anyone can download without signing in (the release job below). Each new build
# replaces it, so its links never change:
#   https://github.com/Brian9761/Barber-App/releases/tag/test-build              the page
#   https://github.com/Brian9761/Barber-App/releases/download/test-build/<file>  each file
# The notes on that page, for testers, are .github/test-build-notes.md. Pushes to v4 and v5/**
# and runs started by hand publish nothing; to publish again, re-run the newest push run.
on:
  push:
    branches: [test-builds, v4, "v5/**"]
    paths:
      - "project.yml"
      - "IzzyClipz/**"
      - "IzzyClipzBusiness/**"
      - "Packages/**"
      - ".github/workflows/test-builds.yml"
      - ".github/test-build-notes.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Demo builds
    # GitHub's Intel Macs: its Apple silicon Macs are often short on capacity, and a job none of
    # them picks up within 15 minutes is cancelled. Intel builds the same files (arm64 for
    # iPhones; arm64 and x86_64 for the Simulator), just more slowly.
    runs-on: macos-26-intel
    timeout-minutes: 120
    # A newer push stops an older build, but never a publish halfway through (the release job has
    # its own group), which would leave no release until the next build finished.
    concurrency:
      group: test-builds-${{ github.ref }}
      cancel-in-progress: true
    env:
      # Swift packages (Stripe Terminal's 34 MB download) are fetched once and shared by every build.
      PACKAGES: build/SourcePackages
      DERIVED: build/DerivedData
      OUT: build/demo-builds
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      # The committed IzzyClipz.xcodeproj can lag project.yml (it's regenerated on v4 only).
      - name: Generate the Xcode project from project.yml
        run: |
          brew install xcodegen
          xcodegen --version
          xcodegen generate

      - uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-test-builds-${{ hashFiles('project.yml') }}

      - name: Resolve Swift packages (Stripe Terminal 6.0.0)
        run: |
          for attempt in 1 2 3; do
            xcodebuild -resolvePackageDependencies \
              -project IzzyClipz.xcodeproj \
              -scheme IzzyClipzBusiness \
              -clonedSourcePackagesDirPath "$PACKAGES" && exit 0
            echo "Resolving failed (attempt $attempt); retrying"
            sleep 10
          done
          exit 1

      # Release, stripped (DEPLOYMENT_POSTPROCESSING), no dSYMs or preview dylibs, not signed.
      - name: Build for the iOS Simulator
        run: |
          mkdir -p build/logs
          build() { # $1 = scheme, $2 = architectures
            set +e
            xcodebuild build \
              -project IzzyClipz.xcodeproj \
              -scheme "$1" \
              -configuration Release \
              -sdk iphonesimulator \
              -destination "generic/platform=iOS Simulator" \
              -derivedDataPath "$DERIVED" \
              -clonedSourcePackagesDirPath "$PACKAGES" \
              ARCHS="$2" ONLY_ACTIVE_ARCH=NO \
              IZZY_DEMO_MODE=YES \
              DEPLOYMENT_POSTPROCESSING=YES STRIP_INSTALLED_PRODUCT=YES \
              DEBUG_INFORMATION_FORMAT=dwarf ENABLE_PREVIEWS=NO ENABLE_DEBUG_DYLIB=NO \
              CODE_SIGNING_ALLOWED=NO \
              > "build/logs/$1-simulator.log" 2>&1
            status=$?
            set -e
            grep -E "error:|warning:|\*\* BUILD" "build/logs/$1-simulator.log" | sort -u | head -100
            if [ $status -ne 0 ]; then tail -80 "build/logs/$1-simulator.log"; exit $status; fi
          }
          # Both for Apple silicon and Intel Macs (the owner app's Simulator download is bigger for it:
          # Stripe's SDK for both kinds of Mac is 82 MB before zipping).
          build IzzyClipz "arm64 x86_64"
          build IzzyClipzBusiness "arm64 x86_64"

      - name: Archive for iPhones
        run: |
          archive() { # $1 = scheme
            set +e
            xcodebuild archive \
              -project IzzyClipz.xcodeproj \
              -scheme "$1" \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -archivePath "build/$1.xcarchive" \
              -derivedDataPath "$DERIVED" \
              -clonedSourcePackagesDirPath "$PACKAGES" \
              IZZY_DEMO_MODE=YES \
              DEBUG_INFORMATION_FORMAT=dwarf ENABLE_PREVIEWS=NO ENABLE_DEBUG_DYLIB=NO \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
              > "build/logs/$1-archive.log" 2>&1
            status=$?
            set -e
            grep -E "error:|warning:|\*\* ARCHIVE" "build/logs/$1-archive.log" | sort -u | head -100
            if [ $status -ne 0 ]; then tail -80 "build/logs/$1-archive.log"; exit $status; fi
          }
          archive IzzyClipz
          archive IzzyClipzBusiness

      - name: Package
        run: |
          set -euo pipefail
          SIM="$DERIVED/Build/Products/Release-iphonesimulator"
          mkdir -p "$OUT"
          OUT_PATH="$PWD/$OUT"


          for app in IzzyClipz IzzyClipzBusiness; do
            ditto -c -k --norsrc --noqtn --keepParent --zlibCompressionLevel 9 \
              "$SIM/$app.app" "$OUT_PATH/$app-Demo-Simulator.zip"
            # An .ipa is the app in a folder named Payload, zipped.
            rm -rf build/ipa && mkdir -p build/ipa/Payload
            ditto --norsrc "build/$app.xcarchive/Products/Applications/$app.app" "build/ipa/Payload/$app.app"
            (cd build/ipa && zip -qr -X -y -9 "$OUT_PATH/$app-Demo.ipa" Payload)
          done
          (cd "$OUT" && shasum -a 256 IzzyClipz-Demo.ipa IzzyClipzBusiness-Demo.ipa \
            IzzyClipz-Demo-Simulator.zip IzzyClipzBusiness-Demo-Simulator.zip > SHA256SUMS.txt)

      - name: Check the builds
        run: |
          set -euo pipefail
          SIM="$DERIVED/Build/Products/Release-iphonesimulator"
          DEVICE="Products/Applications"
          apps=("$SIM/IzzyClipz.app" "$SIM/IzzyClipzBusiness.app" \
            "build/IzzyClipz.xcarchive/$DEVICE/IzzyClipz.app" "build/IzzyClipzBusiness.xcarchive/$DEVICE/IzzyClipzBusiness.app")
          for app in "${apps[@]}"; do
            name=$(basename "$app" .app)
            flag=$(plutil -extract IzzyDemoMode raw -o - "$app/Info.plist")
            echo "== $app: IzzyDemoMode = $flag"
            [ "$flag" = YES ] || { echo "::error::$app isn't the demo version"; exit 1; }
            lipo -info "$app/$name"
            if [ -d "$app/Frameworks" ]; then
              for framework in "$app"/Frameworks/*.framework; do lipo -info "$framework/$(basename "$framework" .framework)"; done
            fi
            # Nothing for debugging inside the app.
            if find "$app" \( -name '*.dSYM' -o -name '*.debug.dylib' -o -name '__preview.dylib' \) | grep .; then
              echo "::error::$app has debugging files inside"; exit 1
            fi
            du -sh "$app"
            (du -sk "$app"/* "$app"/Frameworks/* 2>/dev/null || true) | sort -rn | sed -n 1,6p
          done

          echo "== Files"
          echo "| File | Bytes | MB |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | ---: | ---: |" >> "$GITHUB_STEP_SUMMARY"
          for file in IzzyClipz-Demo.ipa IzzyClipzBusiness-Demo.ipa IzzyClipz-Demo-Simulator.zip IzzyClipzBusiness-Demo-Simulator.zip SHA256SUMS.txt; do
            path="$OUT/$file"
            [ -s "$path" ] || { echo "::error::$file is missing or empty"; exit 1; }
            bytes=$(stat -f%z "$path")
            mb=$(awk -v bytes="$bytes" 'BEGIN { printf "%.2f", bytes / 1000000 }')
            echo "$file: $bytes bytes ($mb MB)"
            echo "| $file | $bytes | $mb |" >> "$GITHUB_STEP_SUMMARY"
          done
          cat "$OUT/SHA256SUMS.txt"
          (cd "$OUT" && shasum -a 256 -c SHA256SUMS.txt)
          for file in "$OUT"/*.ipa; do
            listing=$(unzip -l "$file")
            grep -qE " Payload/[^/]+\.app/Info\.plist$" <<< "$listing" || { echo "::error::$file has no Payload/<App>.app"; exit 1; }
          done

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: izzy-clipz-demo-builds
          path: build/demo-builds/
          if-no-files-found: error
          retention-days: 14
          # The files are zipped already.
          compression-level: 0

      # Installs each Simulator build from its zip, as a tester would, and checks it's still
      # running a few seconds after launch.
      - name: Launch the Simulator builds
        run: |
          set -euo pipefail
          SIMULATOR=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          best = None
          for runtime, devices in json.load(sys.stdin)["devices"].items():
              if ".iOS-" not in runtime:
                  continue
              version = tuple(int(part) for part in runtime.split(".iOS-")[-1].split("-"))
              # The owner app needs iOS 18.
              if version < (18,):
                  continue
              for device in devices:
                  name = device["name"]
                  if not name.startswith("iPhone") or not device.get("isAvailable", True):
                      continue
                  rank = (version, name.endswith(" Pro"), name)
                  if best is None or rank > best[0]:
                      best = (rank, device["udid"], name, runtime)
          if best is None:
              sys.exit("No iOS 18+ iPhone simulator available")
          print(best[1], best[2], best[3], file=sys.stderr)
          print(best[1])
          ')
          xcrun simctl boot "$SIMULATOR" || true
          xcrun simctl bootstatus "$SIMULATOR" -b
          xcrun simctl status_bar "$SIMULATOR" override --time "9:41" --dataNetwork wifi --wifiBars 3 --cellularBars 4 --batteryState charged --batteryLevel 100 || true
          mkdir -p build/screenshots
          for app in IzzyClipz IzzyClipzBusiness; do
            rm -rf build/unzipped && mkdir -p build/unzipped
            ditto -x -k "$OUT/$app-Demo-Simulator.zip" build/unzipped
            bundle=$(plutil -extract CFBundleIdentifier raw -o - "build/unzipped/$app.app/Info.plist")
            xcrun simctl install "$SIMULATOR" "build/unzipped/$app.app"
            xcrun simctl launch "$SIMULATOR" "$bundle"
            sleep 15
            xcrun simctl io "$SIMULATOR" screenshot "build/screenshots/$app-Demo.png"
            running=$(xcrun simctl spawn "$SIMULATOR" launchctl list)
            if ! grep -q "UIKitApplication:$bundle" <<< "$running"; then
              echo "::error::$app wasn't running 15 seconds after launch"
              xcrun simctl spawn "$SIMULATOR" log show --last 2m --style compact --predicate "process == \"$app\"" | tail -60 || true
              exit 1
            fi
            echo "$app is running"
            xcrun simctl terminate "$SIMULATOR" "$bundle" || true
          done

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: demo-screenshots
          path: build/screenshots
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: demo-build-logs
          path: build/logs
          if-no-files-found: ignore
          retention-days: 14

  # Replaces the public prerelease tagged test-build with this run's files (see the top). Only
  # pushes to test-builds publish, and this is the only job that may write to the repo.
  release:
    name: Publish the test build
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/test-builds'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    # One publish at a time; a newer one waits for this one to finish.
    concurrency:
      group: test-build-release
      cancel-in-progress: false
    env:
      GH_REPO: ${{ github.repository }}
      TAG: test-build
      FILES: IzzyClipz-Demo.ipa IzzyClipzBusiness-Demo.ipa IzzyClipz-Demo-Simulator.zip IzzyClipzBusiness-Demo-Simulator.zip SHA256SUMS.txt
    steps:
      # Just the notes template.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/test-build-notes.md
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/download-artifact@v7
        with:
          name: izzy-clipz-demo-builds
          path: build/demo-builds

      - name: Check the files
        working-directory: build/demo-builds
        run: |
          set -euo pipefail
          ls -l
          for file in $FILES; do
            [ -s "$file" ] || { echo "::error::$file is missing or empty"; exit 1; }
          done
          # SHA256SUMS.txt lists the four apps, and each one matches it.
          listed=$(awk '{ print $2 }' SHA256SUMS.txt | sort)
          expected=$(printf '%s\n' $FILES | grep -vx SHA256SUMS.txt | sort)
          if [ "$listed" != "$expected" ]; then
            echo "::error::SHA256SUMS.txt doesn't list the four apps"
            cat SHA256SUMS.txt
            exit 1
          fi
          sha256sum --check --strict SHA256SUMS.txt

      # The template (without its first line, a comment for whoever edits it) with this build's
      # commit, date (the shop's time) and checksums.
      - name: Write the release notes
        run: |
          set -euo pipefail
          notes=$(sed '1{/^<!--.*-->$/d;}' .github/test-build-notes.md)
          commit="${GITHUB_SHA::7}"
          commit_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
          date=$(TZ=America/Los_Angeles date '+%B %-d, %Y at %-I:%M %p %Z')
          sums=$(cat build/demo-builds/SHA256SUMS.txt)
          notes=${notes//'{{COMMIT}}'/"$commit"}
          notes=${notes//'{{COMMIT_URL}}'/"$commit_url"}
          notes=${notes//'{{DATE}}'/"$date"}
          notes=${notes//'{{SHA256SUMS}}'/"$sums"}
          if grep -o '{{[A-Za-z0-9_]*}}' <<< "$notes"; then
            echo "::error::.github/test-build-notes.md has a placeholder this job doesn't fill in"
            exit 1
          fi
          printf '%s\n' "$notes" > build/notes.md
          cat build/notes.md

      # Deletes the release and its tag (there's none the first time), then makes both again at
      # this commit. gh uploads the files to a draft and publishes it once they're all there.
      - name: Publish
        working-directory: build/demo-builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" --prerelease --title "Izzy Clipz test build (demo)" \
            --notes-file ../notes.md --target "$GITHUB_SHA" $FILES

      # The tag is this commit, the page is a public prerelease with the five files, and anyone
      # can download them without signing in.
      - name: Check the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tagged=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq .object.sha)
          if [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error::The $TAG tag is $tagged, not this commit"
            exit 1
          fi
          state=$(gh release view "$TAG" --json isDraft,isPrerelease,assets --jq '"\(.isDraft) \(.isPrerelease) \(.assets | length)"')
          if [ "$state" != "false true 5" ]; then
            echo "::error::The release isn't a published prerelease with five files (draft, prerelease, files: $state)"
            exit 1
          fi
          mkdir -p build/public
          for file in $FILES; do
            curl -sSfL --retry 5 --retry-delay 5 --retry-all-errors -o "build/public/$file" \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG/$file"
          done
          cmp build/public/SHA256SUMS.txt build/demo-builds/SHA256SUMS.txt
          (cd build/public && sha256sum --check --strict SHA256SUMS.txt)
          page="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"
          echo "Published: $page"
          {
            echo "### [Izzy Clipz test build (demo)]($page)"
            echo
            for file in $FILES; do
              echo "- $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG/$file"
            done
          } >> "$GITHUB_STEP_SUMMARY"
