name: iOS

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: Core logic on Linux
    runs-on: ubuntu-latest
    container: swift:6.0-jammy
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Test IzzyClipzKit
        run: swift test --package-path Packages/IzzyClipzKit

  app:
    name: App on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # macos-26 has Xcode 26, the SDK the App Store requires; macos-15 checks Xcode 16 still builds.
        runner: [macos-26, macos-15]
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test IzzyClipzKit on macOS
        run: swift test --package-path Packages/IzzyClipzKit

      - name: Pick an iPhone simulator
        run: |
          SIMULATOR=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          best = None
          for runtime, devices in json.load(sys.stdin)["devices"].items():
              if ".iOS-" not in runtime:
                  continue
              version = tuple(int(part) for part in runtime.split(".iOS-")[-1].split("-"))
              for device in devices:
                  name = device["name"]
                  if not name.startswith("iPhone") or not device.get("isAvailable", True):
                      continue
                  # Newest iOS first, then prefer a standard "Pro" model.
                  rank = (version, name.endswith(" Pro"), name)
                  if best is None or rank > best[0]:
                      best = (rank, device["udid"], name, runtime)
          if best is None:
              sys.exit("No iPhone simulator available")
          print(best[1], best[2], best[3], file=sys.stderr)
          print(best[1])
          ')
          echo "SIMULATOR=$SIMULATOR" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIMULATOR" || true
          xcrun simctl bootstatus "$SIMULATOR" -b
          xcrun simctl status_bar "$SIMULATOR" override --time "9:41" --dataNetwork wifi --wifiBars 3 --cellularBars 4 --batteryState charged --batteryLevel 100 || true

      - name: Build and test the app
        run: |
          mkdir -p build
          set +e
          xcodebuild test \
            -project IzzyClipz.xcodeproj \
            -scheme IzzyClipz \
            -destination "id=$SIMULATOR" \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            > build/test.log 2>&1
          status=$?
          # The full log is huge; show what matters.
          grep -E "error:|warning:|\*\* TEST|Executed [0-9]+ test" build/test.log | sort -u | head -200
          grep -iE "^Test case .*(passed|failed)" build/test.log | head -200
          if [ $status -ne 0 ]; then tail -80 build/test.log; fi
          exit $status

      - name: Build for devices (Release)
        run: |
          set +e
          xcodebuild build \
            -project IzzyClipz.xcodeproj \
            -scheme IzzyClipz \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            > build/release.log 2>&1
          status=$?
          grep -E "error:|warning:|\*\* BUILD" build/release.log | sort -u | head -200
          if [ $status -ne 0 ]; then tail -80 build/release.log; fi
          exit $status

      - name: Export screenshots
        if: always()
        run: |
          mkdir -p build/attachments build/screenshots
          if [ -d build/TestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path build/TestResults.xcresult --output-path build/attachments || true
          fi
          if [ -f build/attachments/manifest.json ]; then
            # Name each file after its screenshot ("01-Home.png") and shrink it for the web.
            python3 - <<'EOF'
          import json, pathlib, shutil
          source = pathlib.Path("build/attachments")
          target = pathlib.Path("build/screenshots")
          try:
              for test in json.loads((source / "manifest.json").read_text()):
                  for attachment in test.get("attachments", []):
                      name = attachment["suggestedHumanReadableName"].split("_0_")[0]
                      shutil.copy(source / attachment["exportedFileName"], target / f"{name}.png")
          except Exception as error:
              # Screenshots are a convenience; never fail the build over them.
              print(f"Couldn't read the attachment manifest ({error}); keeping original names")
              for png in source.glob("*.png"):
                  shutil.copy(png, target / png.name)
          EOF
            for file in build/screenshots/*.png; do sips -Z 1400 "$file" > /dev/null; done
          fi
          ls build/screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ matrix.runner }}
          path: build/screenshots
          if-no-files-found: warn

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.runner }}
          path: |
            build/TestResults.xcresult
            build/*.log
          if-no-files-found: ignore

  publish-screenshots:
    name: Publish screenshots
    needs: app
    # Pushes to main publish to "screenshots" (the README shows those). Runs started
    # by hand on another branch publish to "screenshots-<branch>", even when a test
    # failed, so the screens can be reviewed before merging.
    if: ${{ !cancelled() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: screenshots-macos-26
          path: screenshots

      - name: Push to the screenshots branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -z "$(ls -A screenshots 2>/dev/null)" ]; then
            echo "No screenshots to publish"
            exit 0
          fi
          if [ "$REF_NAME" = "main" ]; then
            TARGET=screenshots
          else
            TARGET="screenshots-${REF_NAME//\//-}"
          fi
          cd screenshots
          git init -q -b "$TARGET"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots from ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$TARGET"
