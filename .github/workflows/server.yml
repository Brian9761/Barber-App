name: Server

# Type-checks and tests the API in server/ on Linux: against PGlite (Postgres in
# WASM, through pglite-socket) on Node 22 and 24, and against a real Postgres
# service so concurrent bookings really race. Builds and tests the website in
# server/web: type checks, unit tests, the build, and Playwright end to end
# against the real API on PGlite.
on:
  push:
    paths: ['server/**', '.github/workflows/server.yml']
  pull_request:
    paths: ['server/**', '.github/workflows/server.yml']
  workflow_dispatch:

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: server

jobs:
  pglite:
    name: Tests (Node ${{ matrix.node }}, PGlite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - name: Contract fixtures are committed and up to date
        run: test -z "$(git status --porcelain -- test/fixtures/contract)"

  postgres:
    name: Tests (Node 24, Postgres 17)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
      - name: npm run migrate is idempotent
        env:
          DATABASE_URL_UNPOOLED: postgres://postgres:postgres@localhost:5432/postgres
        run: |
          npm run migrate
          npm run migrate | tee migrate.log
          grep -q "(0 new)" migrate.log

  web:
    name: Website (build, unit and end-to-end tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            server/web/package-lock.json
      # The end-to-end server runs the API's own code, so the server's packages too.
      - run: npm ci
      - run: npm ci
        working-directory: server/web
      - run: npm run typecheck
        working-directory: server/web
      - run: npm test
        working-directory: server/web
      - run: npm run build
        working-directory: server/web
      - name: The site builds into public/, which stays out of git
        run: test -f public/index.html && test -z "$(git status --porcelain --ignored=no -- public)"
      - name: Chromium for Playwright
        run: npx playwright install --with-deps chromium
        working-directory: server/web
      - run: npm run e2e
        working-directory: server/web
        env:
          E2E_SHOTS_DIR: ${{ github.workspace }}/web-shots
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: website-screenshots
          path: web-shots
          if-no-files-found: warn
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: website-playwright-report
          path: |
            server/web/playwright-report
            server/web/test-results
          if-no-files-found: ignore
