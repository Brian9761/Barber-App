name: Server

# Type-checks and tests the API in server/ on Linux: against PGlite (Postgres in
# WASM, through pglite-socket) on Node 22 and 24, and against a real Postgres
# service so concurrent bookings really race.
on:
  push:
    paths: ['server/**', '.github/workflows/server.yml']
  pull_request:
    paths: ['server/**', '.github/workflows/server.yml']
  workflow_dispatch:

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: server

jobs:
  pglite:
    name: Tests (Node ${{ matrix.node }}, PGlite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - name: Contract fixtures are committed and up to date
        run: test -z "$(git status --porcelain -- test/fixtures/contract)"

  postgres:
    name: Tests (Node 24, Postgres 17)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
      - name: npm run migrate is idempotent
        env:
          DATABASE_URL_UNPOOLED: postgres://postgres:postgres@localhost:5432/postgres
        run: |
          npm run migrate
          npm run migrate | tee migrate.log
          grep -q "(0 new)" migrate.log
