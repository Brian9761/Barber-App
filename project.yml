# XcodeGen spec for the Izzy Clipz iOS app.
#
# IzzyClipz.xcodeproj is generated from this file and committed, so the app
# opens in Xcode with no extra tools. After changing this file, regenerate it:
#
#     xcodegen generate
#
name: IzzyClipz

options:
  bundleIdPrefix: com.izzyclipz
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
    # Set your Apple Developer team here or in Xcode's Signing & Capabilities tab.
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  IzzyClipzKit:
    path: Packages/IzzyClipzKit
  # Tap to Pay on iPhone, for the owner app only. 6.0.0 and later ship only
  # through SPM; pinned exactly, since Stripe ships breaking changes in majors.
  StripeTerminal:
    url: https://github.com/stripe/stripe-terminal-ios-spm
    exactVersion: 6.0.0

targets:
  IzzyClipz:
    type: application
    platform: iOS
    sources:
      - path: IzzyClipz
    dependencies:
      - package: IzzyClipzKit
    info:
      path: IzzyClipz/Info.plist
      properties:
        CFBundleDisplayName: Izzy Clipz
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        UIUserInterfaceStyle: Dark
        UIAppFonts:
          - ArchivoExtraCondensed-Black.ttf
          - ArchivoCondensed-ExtraBold.ttf
          - ArchivoExpanded-Black.ttf
          - ArchivoExpanded-ExtraBold.ttf
          - Archivo-Regular.ttf
          - Archivo-Medium.ttf
          - Archivo-SemiBold.ttf
          - Archivo-Bold.ttf
          - SpaceMono-Regular.ttf
          - SpaceMono-Bold.ttf
          - RubikWetPaint-Regular.ttf
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_NAME: IzzyClipz
        PRODUCT_BUNDLE_IDENTIFIER: com.izzyclipz.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES

  IzzyClipzTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: IzzyClipzTests
    dependencies:
      - target: IzzyClipz
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.izzyclipz.app.tests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES

  IzzyClipzUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: IzzyClipzUITests
    dependencies:
      - target: IzzyClipz
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.izzyclipz.app.uitests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: IzzyClipz

  # The owner app, "Izzy Clipz Business": schedule, walk-ins, time off,
  # products and Tap to Pay on iPhone. iOS 18 for Apple's Tap to Pay
  # education screens (ProximityReaderDiscovery).
  IzzyClipzBusiness:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: IzzyClipzBusiness
    dependencies:
      - package: IzzyClipzKit
      - package: StripeTerminal
        product: StripeTerminal
    info:
      path: IzzyClipzBusiness/Info.plist
      properties:
        CFBundleDisplayName: Izzy Clipz Business
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        IzzyAPIBaseURL: https://izzy-clipz-api.vercel.app
        NSBluetoothAlwaysUsageDescription: Stripe's card payment software can also work with Bluetooth card readers, so iOS asks every app that includes it to explain Bluetooth. Izzy Clipz Business takes cards with Tap to Pay on iPhone and doesn't connect to Bluetooth devices.
        NSCameraUsageDescription: Take photos of the shop's products to show them in the Izzy Clipz app.
        NSLocationWhenInUseUsageDescription: Card networks require the location of every card payment, so Stripe checks this iPhone's location while you take a payment with Tap to Pay on iPhone.
        NSPhotoLibraryUsageDescription: Choose photos of the shop's products to show them in the Izzy Clipz app.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        # Tap to Pay on iPhone needs an iPhone XS (A12) or later.
        UIRequiredDeviceCapabilities:
          - arm64
          - iphone-ipad-minimum-performance-a12
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
    entitlements:
      path: IzzyClipzBusiness/IzzyClipzBusiness.entitlements
      properties:
        com.apple.developer.proximity-reader.payment.acceptance: true
    settings:
      base:
        PRODUCT_NAME: IzzyClipzBusiness
        PRODUCT_BUNDLE_IDENTIFIER: com.izzyclipz.business
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: IzzyClipzBusiness/IzzyClipzBusiness.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES

  IzzyClipzBusinessTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: IzzyClipzBusinessTests
    dependencies:
      - target: IzzyClipzBusiness
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.izzyclipz.business.tests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES

  IzzyClipzBusinessUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: IzzyClipzBusinessUITests
    dependencies:
      - target: IzzyClipzBusiness
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.izzyclipz.business.uitests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: IzzyClipzBusiness

schemes:
  IzzyClipz:
    build:
      targets:
        IzzyClipz: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - IzzyClipz
      targets:
        - name: IzzyClipzTests
        - name: IzzyClipzUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  IzzyClipzBusiness:
    build:
      targets:
        IzzyClipzBusiness: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - IzzyClipzBusiness
      targets:
        - name: IzzyClipzBusinessTests
        - name: IzzyClipzBusinessUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
